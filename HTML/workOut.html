
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workouts - FitTrack</title>

    <link rel="stylesheet" href="/CSS/gymApp.css">
    <link rel="stylesheet" href="/CSS/workOuts.css">
</head>

<body>

    <nav>
        <h2>FitTrack</h2>

        <ul>
            <li><a href="gymApp.html">Home</a></li>
            <li><a href="workOut.html">Workouts</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>

    <section class="hero page-hero">
        <h1>Your Workouts</h1>
        <p>Choose a workout and start your journey.</p>
    </section>

    <main class="container">

        <section class="workout-list" id="workout-list">

            <div class="workout-card" data-id="pushups">
                <h2>Push Ups</h2>
                <p>3 Sets × 15 Reps</p>
                <span class="workout-status">Not Started</span>
                <button class="workout-btn">Start</button>
            </div>

            <div class="workout-card" data-id="squats">
                <h2>Squats</h2>
                <p>3 Sets × 20 Reps</p>
                <span class="workout-status">Not Started</span>
                <button class="workout-btn">Start</button>
            </div>

            <div class="workout-card" data-id="plank">
                <h2>Plank</h2>
                <p>3 Sets × 30 Seconds</p>
                <span class="workout-status">Not Started</span>
                <button class="workout-btn">Start</button>
            </div>

        </section>

        <div class="bottom-buttons">
            <button onclick="goHome()">Back Home</button>
        </div>

    </main>

    <footer>
        <p>© 2026 FitTrack</p>
    </footer>

    <script src="/JS/gymApp.js"></script>

</body>
</html>
